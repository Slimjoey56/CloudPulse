[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpulse"
version = "0.1.0"
description = "Infrastructure telemetry analytics, anomaly detection, and capacity forecasting research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3.0", "pandas>=2.2,<4.0", "pydantic>=2.7,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.5,<1.0", "mypy>=1.10,<2.0", "pandas-stubs>=2.2"]
api = ["fastapi>=0.111,<1.0", "uvicorn[standard]>=0.30,<1.0"]

[project.scripts]
cloudpulse-download-microsoft = "cloudpulse.data.download_microsoft:main"
cloudpulse-audit-microsoft = "cloudpulse.data.audit_microsoft:main"
cloudpulse-explore-microsoft = "cloudpulse.data.explore_microsoft:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["I001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
